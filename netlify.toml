[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Order matters: rules are evaluated top to bottom, so the API proxy has to come
# before the SPA catch-all or /api/* would be answered with index.html.

# Proxies API calls to the Railway backend. Because the browser only ever talks
# to the Netlify origin, there is no CORS to configure on the backend.
[[redirects]]
  from = "/api/*"
  to = "https://blackcardtrainerback-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback. Static files (assets) are matched before redirects, so this only
# catches unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed asset filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html points at the hashed assets, so it must always be revalidated.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
