[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_BASE_URL = ""

# Match API requests before the fallback to index.html.
# Netlify forwards the browser's same-origin requests to the VPS.
[[redirects]]
  from = "/api/*"
  to = "https://trainer.85-190-101-59.sslip.io/api/:splat"
  status = 200
  force = true

# SPA fallback. Static files (assets) are matched before redirects, so this only
# catches unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed asset filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html points at the hashed assets, so it must always be revalidated.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
